name: Android CI

# Every push to main and every pull request. Nothing merges without this passing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes to the shared cache, so a pull request cannot poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify the Gradle wrapper is the official one
        # A tampered wrapper JAR executes arbitrary code in every later step, so
        # this runs before anything invokes it.
        uses: gradle/actions/wrapper-validation@v6

      - name: Make the wrapper executable
        # Git on Windows does not track the executable bit, so a commit made
        # there can land gradlew as mode 100644 and every later step dies with
        # exit code 126. The index mode is the real fix; this is the guard that
        # keeps a Windows contributor from breaking CI silently.
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        # warningsAsErrors is on, so a new warning fails here.
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release
        # R8 and resource shrinking only run in the release build, and they break
        # differently from debug. Catching that here rather than at tag time.
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
