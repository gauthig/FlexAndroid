name: Release

# Tag-driven. Pushing v0.2.0 builds and publishes a draft release for it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Verify the Gradle wrapper is the official one
        uses: gradle/actions/wrapper-validation@v6

      - name: Make the wrapper executable
        # See the note in android-ci.yml: Git on Windows drops the exec bit.
        run: chmod +x ./gradlew

      - name: Test and lint
        # A tag should not produce a release that main would have rejected.
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      # ---------------------------------------------------------------------
      # Signing. Disabled by default: an unsigned artifact is honest, whereas a
      # workflow that references absent secrets fails confusingly. To enable,
      # add RELEASE_KEYSTORE (base64 of the .jks), RELEASE_KEYSTORE_PASSWORD,
      # RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD as repository secrets, wire
      # the signingConfig into app/build.gradle.kts as docs/PUBLISHING.md
      # describes, then uncomment this step.
      # ---------------------------------------------------------------------
      # - name: Decode the signing keystore
      #   env:
      #     KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
      #   run: |
      #     printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      #     cat > keystore.properties <<EOF
      #     storeFile=$RUNNER_TEMP/release.jks
      #     storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      #     keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
      #     keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
      #     EOF
      # - name: Assemble signed release
      #   run: ./gradlew --no-daemon assembleRelease

      - name: Collect artefacts
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          ls -la dist

      - name: Publish a draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          # Draft, not published: a human should read the notes and confirm the
          # build was tested before it is offered to anyone.
          draft: true
          generate_release_notes: true
          body: |
            > **This build has not been verified against physical radio hardware.**
            > See the verification table in the README before transmitting with it.

            Built from ${{ github.sha }}.

            GPL-3.0-or-later. Source for this build is the tagged commit above.
